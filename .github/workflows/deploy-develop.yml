name: Deploy Container Lambda (develop)

on:
  push:
    branches: [ "develop" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ secrets.ECR_REPO }}
  LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub ref/repo/event (what `sub` should look like)
        run: |
          echo "repo=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "EXPECTED_SUB=repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"

      - name: Dump OIDC token claims (iss, aud, sub)
        run: |
          set -euo pipefail
          # Request a token for the standard audience expected by AWS STS
          TOK_JSON=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC=$(echo "$TOK_JSON" | jq -r '.value')
          IFS='.' read -r HDR PAY SIG <<<"$OIDC"
          echo "OIDC header:"; echo "$HDR" | base64 -d 2>/dev/null || true
          echo "OIDC payload:"; echo "$PAY" | base64 -d 2>/dev/null | jq '{iss, aud, sub}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${ECR_REPO}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${ECR_REPO}:$IMAGE_TAG
          # also push a 'develop' tag for convenience
          docker tag $ECR_REGISTRY/${ECR_REPO}:$IMAGE_TAG $ECR_REGISTRY/${ECR_REPO}:develop
          docker push $ECR_REGISTRY/${ECR_REPO}:develop
          echo "IMAGE_URI=$ECR_REGISTRY/${ECR_REPO}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Lambda to new image
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --publish

      - name: Output Lambda version
        run: |
          aws lambda get-function --function-name "${LAMBDA_FUNCTION_NAME}" --query 'Configuration.[Version,LastModified,ImageUri]'
