name: Build & Deploy Lambda (ECR Image)

on:
  push:
    branches: [ develop ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gkfantasy-nfl-make-projections-for-event
  LAMBDA_FUNCTION_NAME: gkfantasy-nfl-make-projections-for-event

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        run: |
          AWS_REGION=${{ env.AWS_REGION }}
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}
          IMAGE_TAG=${GITHUB_SHA}

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT

          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .

          echo "Pushing image: $IMAGE_URI"
          docker push "$IMAGE_URI"

          # Optional: also push a :latest tag
          LATEST_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag "$IMAGE_URI" "$LATEST_IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

      - name: Update Lambda to use new image
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ steps.build-image.outputs.IMAGE_URI }}"
